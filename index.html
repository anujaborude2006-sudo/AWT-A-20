<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID Card Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Student ID Card Registration</h1>

<form id="studentForm">

<label>Student Name</label>
<input type="text" id="name">

<label>Roll Number</label>
<input type="text" id="roll">

<label>Registration Number</label>
<input type="text" id="reg">

<label>Department</label>
<select id="dept">
<option value="">Select Department</option>
<option>IT</option>
<option>ECE</option>
<option>EEE</option>
<option>CSE</option>
<option>CE</option>
</select>

<label>Semester</label>
<input type="number" id="semester">

<label>Email</label>
<input type="email" id="email">

<label>Phone Number</label>
<input type="text" id="phone">

<label>Skill Score (0-100)</label>
<input type="number" id="score">

<button type="button" onclick="registerStudent()">Generate ID Card</button>

</form>

<hr>

<div id="idCard" class="card"></div>

<h2>Preferred Technologies</h2>
<div id="techList"></div>

<script src="script.js"></script>

</body>
</html>
